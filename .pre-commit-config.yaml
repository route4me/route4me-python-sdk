# Install once per clone:
#     pip install pre-commit && pre-commit install
#
# Run against everything:
#     pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=512]
      # Keeps a real key from ever being committed in an example or fixture.
      - id: detect-private-key

  # Blocks API keys and other secrets before they reach a commit; the
  # detect-private-key hook above only catches PEM private keys.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # pylint needs the package's own imports, so it runs from the dev
      # environment (`pip install -e ".[dev]"`) rather than an isolated one.
      - id: pylint-package
        name: pylint (package)
        entry: pylint --rcfile=pyproject.toml
        language: system
        types: [python]
        files: ^route4me/
      # Runs per file: pre-commit passes each changed example file, or every
      # example file with --all-files. Never pass the examples directory: its
      # subfolders have no __init__.py, so pylint would skip them.
      - id: pylint-examples
        name: pylint (examples)
        entry: pylint --rcfile=examples/pylintrc
        language: system
        types: [python]
        files: ^examples/
      - id: pylint-tests
        name: pylint (tests)
        entry: pylint --rcfile=tests/pylintrc
        language: system
        types: [python]
        files: ^tests/
      # pyproject.toml and route4me/version.py both carry the version string.
      # Catching drift at commit time is cheaper than at release time.
      - id: version-consistency
        name: pyproject and route4me/version.py agree
        entry: python -m pytest tests/test_version.py -q --no-header --no-cov
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|route4me/version\.py)$
