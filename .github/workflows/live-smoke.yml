name: Live smoke

# The main suite is offline by design. This job is the only place the SDK
# talks to the real Route4Me API, so that a genuine API change is noticed
# without letting a Route4Me outage turn the master branch red.

on:
  schedule:
    # Nightly, 04:23 UTC.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to run against"
        required: false
        default: "master"

permissions:
  contents: read

jobs:
  smoke:
    name: Live API smoke tests
    runs-on: ubuntu-latest
    # Never blocks anything. Read the summary, don't gate on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'master' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Check the API key secret is configured
        env:
          ROUTE4ME_API_KEY: ${{ secrets.ROUTE4ME_API_KEY }}
        run: |
          if [ -z "$ROUTE4ME_API_KEY" ]; then
            echo "::warning::ROUTE4ME_API_KEY is not set; skipping live smoke tests"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      # `-m live` selects exactly the tests the default run deselects, and
      # --disable-socket must be off here since these are supposed to dial out.
      - name: Live smoke tests
        if: env.skip != 'true'
        env:
          ROUTE4ME_API_KEY: ${{ secrets.ROUTE4ME_API_KEY }}
        run: pytest -m live -v --no-cov -p no:randomly

      - name: Summary
        if: always()
        run: |
          {
            echo "### Live smoke run"
            echo ""
            echo "Ref: \`${{ github.event.inputs.ref || 'master' }}\`"
            echo "Outcome: \`${{ job.status }}\`"
            echo ""
            echo "A failure here means the real API disagreed with the SDK, or"
            echo "Route4Me was unavailable. It does not block merges."
          } >> "$GITHUB_STEP_SUMMARY"
