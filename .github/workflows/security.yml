name: Security

on:
  push:
    branches: [master, development, improvements]
  pull_request:
    branches: [master, development]
  schedule:
    # Weekly, Monday 05:17 UTC. Off the hour to avoid GitHub's cron stampede.
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  bandit:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[security]"

      # Config (including exclude_dirs) lives in pyproject.toml.
      - name: bandit
        run: bandit -c pyproject.toml -r route4me/

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[security]"

      - name: pip-audit
        # Audit the project's declared dependencies, the ones users install. The
        # installed SDK itself is not on PyPI at this version, which --strict rejects.
        run: pip-audit --strict --progress-spinner=off .

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The official binary rather than gitleaks-action, which needs a paid
      # licence on organisation repositories. The checksum is from the release.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: gitleaks
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  leak-canary:
    name: API key must not leak into exceptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[test]"

      # A dedicated job rather than a plain test, because this is the one
      # regression that is silent, ships credentials to third-party log
      # aggregators, and cannot be spotted in review.
      - name: Run redaction tests
        run: pytest tests/ -k "redact or leak" -v
