name: Security

on:
  push:
    branches: [master, development, improvements]
  pull_request:
    branches: [master, development]
  schedule:
    # Weekly, Monday 05:17 UTC. Off the hour to avoid GitHub's cron stampede.
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  bandit:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[security]"

      # Config (including exclude_dirs) lives in pyproject.toml.
      - name: bandit
        run: bandit -c pyproject.toml -r route4me/

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[security]"

      - name: pip-audit
        run: pip-audit --strict --progress-spinner=off

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  leak-canary:
    name: API key must not leak into exceptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[test]"

      # A dedicated job rather than a plain test, because this is the one
      # regression that is silent, ships credentials to third-party log
      # aggregators, and cannot be spotted in review.
      - name: Run redaction tests
        run: pytest tests/ -k "redact or leak" -v
