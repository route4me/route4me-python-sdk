name: Commit validation

# Mirrors the Java and C# SDK repositories, which both enforce conventional
# commits via Commitsar. Keeping the three SDKs consistent matters because
# their changelogs and releases are generated the same way.

on: [pull_request]

permissions:
  contents: read

jobs:
  commitsar:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Commitsar
        uses: aevea/commitsar@909c3ab676c9af63cb84f2e38f395c7e89829b04 # v1.0.3
