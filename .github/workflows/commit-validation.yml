name: Commit validation

# Mirrors the Java and C# SDK repositories, which both enforce conventional
# commits via Commitsar. Keeping the three SDKs consistent matters because
# their changelogs and releases are generated the same way.

on: [pull_request]

permissions:
  contents: read

jobs:
  commitsar:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Commitsar
        uses: aevea/commitsar@916c7b483225a30d3a17f407fa25f5b25888ea69 # v0.20.2
