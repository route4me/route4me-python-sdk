name: CI

on:
  push:
    branches: [master, development, improvements]
  pull_request:
    branches: [master, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # The test extra too: pylint reads the tests, which import pytest and responses.
        run: python -m pip install -e ".[lint,test]"

      - name: ruff check
        run: ruff check route4me/ tests/ examples/ --output-format=github

      - name: ruff format --check
        run: ruff format --check route4me/ tests/ examples/

      # The example subfolders have no __init__.py, so `pylint examples` would
      # check only the top-level scripts. Every example file is passed instead;
      # git's pathspec `*` also matches `/`, so this includes the subfolders.
      - name: pylint
        run: |
          pylint route4me --rcfile=pyproject.toml
          pylint --rcfile=examples/pylintrc $(git ls-files 'examples/*.py')
          pylint tests --rcfile=tests/pylintrc

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[lint]"

      # Typing lands tier by tier (see the mypy overrides in pyproject.toml):
      # strict on the tier-A modules, default checks everywhere else.
      - name: mypy
        run: mypy route4me/

  test:
    name: Test py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Spot-check the other platforms on one interpreter rather than
          # multiplying the whole matrix by three.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[test]"

      # The suite is offline by design: pytest-socket (armed in pyproject.toml)
      # turns any stray real connection into a hard failure.
      - name: pytest
        run: >-
          pytest
          --cov=route4me
          --cov-report=xml
          --cov-report=term-missing


  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[test]" diff-cover

      # Project-wide floor. Raised phase by phase: 65 -> 80 -> 85.
      - name: Project coverage floor
        run: pytest --cov=route4me --cov-report=xml --cov-fail-under=65

      # New and changed lines are held to a much higher bar than the backlog,
      # so the V5 managers cannot land untested while the backfill continues.
      - name: Patch coverage
        if: github.event_name == 'pull_request'
        # The base branch name reaches the script as an environment variable, never
        # spliced into it: pull requests may target any branch of the stack.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          diff-cover coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=90

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Verify the wheel imports and keeps its public surface
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --quiet dist/*.whl
          /tmp/verify/bin/python - <<'PY'
          import pathlib
          import route4me
          from route4me import Route4Me
          from route4me.avoidance_zones import AvoidanceZones, AvoindanceZones

          assert AvoindanceZones is AvoidanceZones, "backwards-compat alias broken"

          client = Route4Me("k" * 32)
          expected = [
              "activity_feed", "address", "address_book", "avoidance_zones",
              "file_uploading", "optimization", "members", "vehicles", "order",
              "gps", "route", "rapid_address", "telematics", "territory",
              "route_status", "orders_group", "optimization_profiles",
          ]
          missing = [name for name in expected if not hasattr(client, name)]
          assert not missing, f"missing resource attributes: {missing}"

          marker = pathlib.Path(route4me.__file__).parent / "py.typed"
          assert marker.exists(), "py.typed missing from the wheel"

          print("OK", route4me.__version__, f"({len(expected)} resources)")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/
