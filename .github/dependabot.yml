version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # Propose a release only once it is a week old, so a compromised release has time
    # to be found and pulled before it reaches a pull request.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      # Conventional commits are enforced by commit-validation.yml, and
      # Dependabot PRs are not exempt.
      prefix: "fix"
      prefix-development: "chore"
      include: scope
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "responses"
          - "ruff"
          - "mypy"
          - "types-*"
          - "bandit"
          - "pip-audit"
          - "diff-cover"
          - "sphinx*"
          - "myst-parser"
          - "build"
          - "twine"
          - "pre-commit"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
