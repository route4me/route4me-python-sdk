[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------- metadata --

[project]
name = "route4me"
version = "0.3.1.0"
description = "Route4Me Python SDK"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "ISC"
license-files = ["LICENSE.md"]
authors = [{ name = "Route4Me Python Team (SDK)", email = "juan@route4me.com" }]
maintainers = [{ name = "Route4Me Python Team (SDK)", email = "juan@route4me.com" }]
keywords = ["route4me", "routing", "optimization", "vrp", "tsp", "sdk", "api"]

# NOTE: no "License :: OSI Approved :: ..." classifier. PEP 639 forbids pairing
# a license classifier with an SPDX `license` expression, and PyPI rejects
# uploads that carry both.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Floors are set by security fixes, not by features:
#   requests 2.33.0  CVE-2024-35195, CVE-2024-47081 (.netrc leak), CVE-2026-25645
#   urllib3  2.8.0   CVE-2024-37891 .. CVE-2026-97689 (redirects, decompression, proxy TLS)
# Those releases need Python 3.10+. On 3.9 the newest available versions are
# the floor instead; the advisories still open there are listed in SECURITY.md.
dependencies = [
    "requests>=2.33.0; python_version >= '3.10'",
    "urllib3>=2.8.0; python_version >= '3.10'",
    "requests>=2.32.5; python_version < '3.10'",
    "urllib3>=2.6.3; python_version < '3.10'",
]

[project.urls]
Homepage = "https://github.com/route4me/route4me-python-sdk"
Repository = "https://github.com/route4me/route4me-python-sdk"
Changelog = "https://github.com/route4me/route4me-python-sdk/blob/master/CHANGELOG.md"
Documentation = "https://route4me.io/docs"
Issues = "https://github.com/route4me/route4me-python-sdk/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
    "pytest-socket>=0.6",
]
lint = [
    "ruff>=0.6",
    "pylint>=3.3",
    "mypy>=1.8",
    "types-requests",
]
security = [
    "bandit>=1.7",
    "pip-audit>=2.7",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
dev = [
    "route4me[test,lint,security,docs]",
    "build>=1.0",
    "twine>=5.0",
    "diff-cover>=9.0",
    "pre-commit>=3.5",
]

# ------------------------------------------------------------------- build --

[tool.hatch.build.targets.wheel]
packages = ["route4me"]

[tool.hatch.build.targets.sdist]
include = [
    "/route4me",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE.md",
    "/pyproject.toml",
]

# -------------------------------------------------------------------- ruff --

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["docs", "build", "dist", ".tox"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default arg -- used deliberately in places
    "RUF012", # mutable class attrs need ClassVar -- too noisy for this codebase
]

[tool.ruff.lint.per-file-ignores]
# Examples are teaching material: they print, they hardcode sample data, and
# they are not imported by the package.
"examples/**" = ["T201", "S101", "E402"]
# Tests assert, use fixtures, and legitimately poke at private attributes.
# S311: seeded `random.Random` is used to make backoff jitter deterministic
#       in tests -- not a cryptographic use.
"tests/**" = ["S101", "S105", "S106", "S311", "ARG", "SLF001"]
# Re-exports.
"route4me/__init__.py" = ["F401"]

# --- No per-file suppressions for library code remain.
#
# Every entry that used to live here was a real defect, scoped to its file and
# dated to the phase that fixed it. All have now been removed along with their
# causes, which is what makes `ruff check` meaningful again:
#
#   S113 (requests call without timeout, api.py)          -- fixed in Phase 4
#   S311 (`random` for retry jitter, address.py)          -- fixed in Phase 6
#   E402 (module-level imports after code, address.py)    -- fixed in Phase 6
#   B904 (`raise e` without `from`, base.py)              -- fixed in Phase 6
#   RUF034 (no-op ternary, the old _api_method.py)        -- fixed in Phase 6
#
# Resist adding one back. If a new finding is genuine, fix it; if it is a false
# positive, suppress it inline at the line with a reason.

[tool.ruff.lint.isort]
known-first-party = ["route4me"]

# ------------------------------------------------------------------ pylint --
#
# The package and the examples must pass with zero messages:
#     pylint route4me examples --rcfile=pyproject.toml
# Tests use tests/pylintrc, which relaxes only the checks that fight pytest.

[tool.pylint.main]
py-version = "3.9"
load-plugins = ["pylint.extensions.docparams"]
jobs = 0

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
# The public enum types in constants.py and bundling.py (TRAVEL_MODE,
# BUNDLING_MODE, ...) are built by constants.enum() and read like constants.
# Renaming them would break every caller, so UPPER_CASE class names are allowed.
class-rgx = "^_?([A-Z][a-zA-Z0-9]*|[A-Z][A-Z0-9_]*)$"

[tool.pylint.design]
# Resource classes map one method to one API operation, so they are wide by nature.
max-public-methods = 40
max-attributes = 12
# SDK methods mirror API parameters; positional ones stay capped at the default 5.
max-args = 8
min-public-methods = 0

[tool.pylint.parameter_documentation]
default-docstring-type = "sphinx"
accept-no-param-doc = false
accept-no-raise-doc = false
accept-no-return-doc = false
accept-no-yields-doc = false

[tool.pylint.similarities]
ignore-imports = true
ignore-signatures = true

[tool.pylint."messages control"]
# Types belong in annotations (checked by mypy), not repeated in docstrings;
# parameters, return values and raised exceptions must still be documented.
# The rest of the list is pylint's own default.
disable = [
    "missing-type-doc",
    "missing-return-type-doc",
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
]

# ------------------------------------------------------------------ pytest --

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# The suite never talks to the real API: tests that need a live key are kept
# outside the repository. No --cov-report=html here: forcing it regenerated
# cover-html/ on every local run, which is how an 86 KB .coverage and a
# 40-file cover-html/ ended up committed to the working tree. Opt in with
# `pytest --cov-report=html` when you actually want it.
addopts = [
    "-v",
    "-rfesxX",
    "--strict-markers",
    "--strict-config",
    # Offline by design. Any test that reaches a real socket fails loudly
    # instead of silently depending on the network, a live key, or Route4Me's
    # uptime.
    "--disable-socket",
    "--allow-unix-socket",
]

# ---------------------------------------------------------------- coverage --

[tool.coverage.run]
branch = true
source = ["route4me"]
omit = ["route4me/version.py"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
]

[tool.coverage.html]
directory = "cover-html"

[tool.coverage.xml]
output = "coverage.xml"

# -------------------------------------------------------------------- mypy --

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
# Deliberately NOT strict globally. This is **kwargs-heavy passthrough code;
# strict mode would emit hundreds of errors on day one and the ratchet below
# would never get started. Strictness is opted into module-by-module as each
# typing tier lands.

# --- Tier A: pure helpers, no dependencies. Fully strict from day one. ------
[[tool.mypy.overrides]]
module = [
    "route4me.utils",
    "route4me.constants",
    "route4me.version",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# --- Tiers B-D: flip these on as each tier lands. ---------------------------
# [[tool.mypy.overrides]]
# module = ["route4me._fields", "route4me.base"]
# disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*", "examples.*"]
ignore_errors = true

# ------------------------------------------------------------------ bandit --

[tool.bandit]
exclude_dirs = ["tests", "examples", "docs", "build", "dist"]

# No skips. B113 (missing request timeout) was removed in Phase 4 and B311
# (`random` for retry jitter) in Phase 6, together with their causes.
#
# The two remaining B113 reports in api.py are genuine false positives -- bandit
# only recognises a *literal* timeout value, not `timeout=self._timeout(...)` --
# and carry a scoped `# nosec B113` each.
skips = []
