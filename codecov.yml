#
# Settings for the https://codecov.io service.
#
# The previous version of this file set only display options (precision,
# round, range), so nothing was ever gated on coverage. The `status` blocks
# below are what make the number load-bearing.
#

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "55...85"

  status:
    project:
      default:
        # Raised phase by phase alongside --cov-fail-under in ci.yml:
        # 55 -> 65 -> 80 -> 85.
        target: 55%
        # Small dips are noise; a real regression is bigger than this.
        threshold: 1%
        if_ci_failed: error

    patch:
      default:
        # New and changed lines are held far higher than the backlog. This is
        # what keeps the ~200 incoming V5 manager methods from landing
        # untested while the historical backfill is still in progress.
        target: 90%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true

ignore:
  - "tests/**"
  - "examples/**"
  - "docs/**"
  - "setup.py"
  - "route4me/version.py"
